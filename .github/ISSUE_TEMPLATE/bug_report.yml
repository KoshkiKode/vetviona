name: Bug Report
description: Something isn't working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        For **security vulnerabilities**, email security@koshkikode.com instead of opening an issue.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Windows
        - macOS
        - Linux
        - Web
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tree builder / relationships
        - GEDCOM import / export
        - RootLoop sync (Auto)
        - RootLoop sync (Manual)
        - Source citations
        - Historical place matching
        - PDF family book
        - Life timelines
        - Relationship finder
        - License / purchase
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Navigate to ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Device: Pixel 8 / iPhone 15 / Surface Pro
        - OS version: Android 15 / iOS 18 / Windows 11
        - App version: 1.x.x
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any Flutter crash logs or attach screenshots.
