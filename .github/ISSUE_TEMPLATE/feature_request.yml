name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion!

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: Describe the problem or pain point this feature would address.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: What would you like to see? How would it work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Any workarounds or alternatives you've thought about?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tree builder / relationships
        - GEDCOM import / export
        - RootLoop sync
        - Source citations
        - Historical place matching
        - PDF family book
        - Life timelines
        - Relationship finder
        - Platforms (Android / iOS / Desktop)
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, or references that might help.
