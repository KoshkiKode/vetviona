name: CI

# Lean check on every push/PR: static analysis + the full Flutter test suite,
# run exactly once. Platform builds live in release.yml and only run for
# `v*` tags or a manual dispatch.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'backend/**'
      - 'website/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'backend/**'
      - 'website/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-pub

      - name: Run unit tests (with coverage)
        working-directory: app
        run: flutter test --no-pub --coverage --reporter=compact

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lcov
          path: app/coverage/lcov.info
          retention-days: 3

      - name: Convert coverage to Cobertura
        working-directory: app
        run: |
          pip install --quiet lcov_cobertura
          python3 -m lcov_cobertura coverage/lcov.info -o coverage/cobertura.xml

      - name: Upload Cobertura coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-dart
          path: app/coverage/cobertura.xml

  upload-coverage-dart:
    name: Upload Dart coverage
    needs: flutter
    if: ${{ !cancelled() && needs.flutter.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-dart

      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura.xml
          language: Dart
          label: code-coverage-agent
