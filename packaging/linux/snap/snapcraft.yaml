name: vetviona
version: '1.0.0'
summary: Private, local-first genealogy app
description: |
  Build interactive family trees, attach sources, and sync across
  devices without a server you need to maintain. Features include
  GEDCOM import/export, historical place matching, RootLoop(TM) WiFi
  and Bluetooth sync, source citations, and life timelines.
icon: snap/gui/vetviona.png

# `devel` until the strict-confinement interfaces below have been reviewed on a
# real desktop; the store only accepts `stable` for fully verified snaps.
grade: devel
confinement: strict
base: core22

architectures:
  - build-on: amd64

apps:
  vetviona:
    command: vetviona
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - bluez
      - home
      - removable-media
      # Secret Service (libsecret) for the stored session token
      - password-manager-service
      # RootLoop mDNS: browse (observe) and publish (control) _vetviona._tcp
      - avahi-observe
      - avahi-control

parts:
  vetviona:
    plugin: nil
    source: snap-bundle
    override-build: |
      mkdir -p "$SNAPCRAFT_PART_INSTALL"
      cp -r * "$SNAPCRAFT_PART_INSTALL/"
    stage-packages:
      - libsecret-1-0
      - libblkid1
      - liblzma5
